services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      args:
        INSTALL_WHISPERX: "${INSTALL_WHISPERX:-0}"
    image: mississauga-demo-server:latest
    container_name: mississauga-demo-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ./data:/app/data                    # ChromaDB persists at ./data/rag
      - ./transcriptions:/app/transcriptions
      - ./chunks:/app/chunks
      - ./parts:/app/parts
